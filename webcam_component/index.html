<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:transparent; font-family: system-ui, sans-serif; }

.wrapper {
  position:relative;
  width:100%;
  background:#0f172a;
  border-radius:14px;
  overflow:hidden;
  min-height:280px;
}

#video {
  width:100%;
  display:block;
  transform:scaleX(-1);
  border-radius:14px;
  min-height:280px;
  object-fit:cover;
}

canvas { display:none; }

/* ── Top overlay ── */
.ov-top {
  position:absolute; top:0; left:0; right:0;
  padding:12px 16px;
  background:linear-gradient(rgba(0,0,0,0.85) 0%,transparent 100%);
  display:none;
  align-items:center;
  gap:10px;
  z-index:2;
}
.live-dot {
  width:10px;height:10px;border-radius:50%;
  background:#10b981;flex-shrink:0;
  animation:blink 1s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}

.pred-big {
  font-size:2rem;font-weight:800;
  color:#10b981;
  text-shadow:0 0 18px rgba(16,185,129,0.9);
  line-height:1;
}
.pred-big.idle { color:#94a3b8; text-shadow:none; }
.conf-small { font-size:0.8rem; color:#cbd5e1; font-weight:600; margin-top:2px; }

/* ── Bottom bar ── */
.ov-bot {
  position:absolute; bottom:0; left:0; right:0;
  padding:8px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,0.7));
  display:none;
  justify-content:space-between;
  align-items:center;
  z-index:2;
}
.bot-tag { font-size:0.75rem; color:#94a3b8; text-transform:uppercase; letter-spacing:0.07em; font-weight:600; }

/* ── Confirmed flash border ── */
.flash-ring {
  position:absolute;top:0;left:0;right:0;bottom:0;
  border:4px solid #10b981;border-radius:14px;
  pointer-events:none;opacity:0;z-index:3;
}
.flash-ring.go { animation:flashFade 0.5s ease forwards; }
@keyframes flashFade{0%{opacity:1}100%{opacity:0}}

/* ── Idle / error screen ── */
.idle-screen {
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:280px;gap:14px;
  color:#cbd5e1;padding:20px;text-align:center;
}
.idle-screen .big { font-size:3rem; }
.idle-screen p { font-size:0.95rem; line-height:1.6; max-width:280px; }
.idle-screen small { font-size:0.8rem; color:#94a3b8; }

.btn-cam {
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;font-weight:700;border:none;border-radius:10px;
  padding:10px 24px;font-size:0.95rem;cursor:pointer;
  transition:all 0.2s;box-shadow:0 4px 16px rgba(99,102,241,0.4);
}
.btn-cam:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(99,102,241,0.6); }
</style>
</head>
<body>

<div class="wrapper" id="wrap">
  <div class="idle-screen" id="idle">
    <div class="big">📷</div>
    <p>Camera ready to start<br><small>Click below to open your camera</small></p>
    <button class="btn-cam" id="startBtn" onclick="startCamera()">Start Camera</button>
  </div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="flash-ring" id="flashRing"></div>
  <div class="ov-top" id="ovTop">
    <div class="live-dot"></div>
    <div>
      <div class="pred-big idle" id="predTxt">—</div>
      <div class="conf-small" id="confTxt">Waiting for AI…</div>
    </div>
  </div>
  <div class="ov-bot" id="ovBot">
    <span class="bot-tag">🤟 Live AI Recognition</span>
    <span class="bot-tag" id="fpsTxt">—</span>
  </div>
</div>

<script>
/* ── Streamlit Component Protocol (Zero External Dependencies) ── */
const Streamlit = {
  setComponentReady: function() {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
  },
  setFrameHeight: function(height) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: height || (document.getElementById('wrap').offsetHeight + 8)
    }, "*");
  },
  setComponentValue: function(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: value,
      dataType: "json"
    }, "*");
  }
};

const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const predTxt  = document.getElementById('predTxt');
const confTxt  = document.getElementById('confTxt');
const ovTop    = document.getElementById('ovTop');
const ovBot    = document.getElementById('ovBot');
const idleDiv  = document.getElementById('idle');
const flashRg  = document.getElementById('flashRing');
const fpsTxt   = document.getElementById('fpsTxt');
const startBtn = document.getElementById('startBtn');

let running = false;
let lastConf = '';
let framesSent = 0;
let fpsT = Date.now();
let captureInterval = null;

/* ── Capture & Send frame to Python ── */
function sendFrame() {
  if (!video.videoWidth || document.hidden || !running) return;
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0);
  ctx.restore();

  const b64 = canvas.toDataURL('image/jpeg', 0.65).split(',')[1];
  Streamlit.setComponentValue({ frame: b64, ts: Date.now() });

  framesSent++;
  const now = Date.now();
  if (now - fpsT >= 2000) {
    fpsTxt.textContent = (framesSent / ((now - fpsT) / 1000)).toFixed(1) + ' fps';
    framesSent = 0;
    fpsT = now;
  }
}

/* ── Start webcam ── */
function startCamera() {
  if (startBtn) startBtn.textContent = 'Opening…';
  navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
  }).then(stream => {
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      idleDiv.style.display = 'none';
      video.style.minHeight = '';
      ovTop.style.display   = 'flex';
      ovBot.style.display   = 'flex';
      running = true;
      if (captureInterval) clearInterval(captureInterval);
      captureInterval = setInterval(sendFrame, 350); // 3 frames per sec
      setTimeout(() => {
        Streamlit.setFrameHeight();
      }, 300);
    };
  }).catch(err => {
    console.error('Camera error:', err);
    idleDiv.innerHTML = '<div class="big">⚠️</div><p style="color:#f87171;">Camera permission denied or camera in use.<br><small style="color:#94a3b8;">Please allow camera in your browser settings and refresh.</small></p><button class="btn-cam" onclick="startCamera()">Retry</button>';
    Streamlit.setFrameHeight();
  });
}

/* ── Green flash on confirmed letter ── */
function flash() {
  flashRg.classList.remove('go');
  void flashRg.offsetWidth;
  flashRg.classList.add('go');
}

/* ── Receive updates from Streamlit Python on rerun ── */
function onRender(data) {
  const a = data.args || {};
  const pred  = a.prediction || '—';
  const conf  = a.confidence || 0;
  const conf2 = a.confirmed || '';

  predTxt.textContent = pred;
  if (pred === '—' || pred === 'No hand') {
    predTxt.className = 'pred-big idle';
    confTxt.textContent = 'Waiting for hand sign…';
  } else {
    predTxt.className = 'pred-big';
    confTxt.textContent = conf > 0 ? 'Confidence: ' + conf.toFixed(1) + '%' : '';
  }

  if (conf2 && conf2 !== lastConf) {
    flash();
    lastConf = conf2;
  }

  Streamlit.setFrameHeight();
}

/* ── Listen for Streamlit parent messages ── */
window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'streamlit:render') {
    onRender(event.data);
  }
});

/* ── Inform Streamlit that component is ready ── */
window.addEventListener('load', function() {
  Streamlit.setComponentReady();
  Streamlit.setFrameHeight(320);
});
// Also notify immediately in case load already fired
Streamlit.setComponentReady();
Streamlit.setFrameHeight(320);
</script>
</body>
</html>
