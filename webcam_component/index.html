<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:transparent; font-family: system-ui, sans-serif; }

.wrapper {
  position:relative;
  width:100%;
  background:#0f172a;
  border-radius:14px;
  overflow:hidden;
  min-height:260px;
}

#video {
  width:100%;
  display:block;
  transform:scaleX(-1);
  border-radius:14px;
  min-height:260px;
  object-fit:cover;
}

canvas { display:none; }

/* ── Top overlay ── */
.ov-top {
  position:absolute; top:0; left:0; right:0;
  padding:12px 16px;
  background:linear-gradient(rgba(0,0,0,0.78) 0%,transparent 100%);
  display:none;
  align-items:center;
  gap:10px;
}
.live-dot {
  width:9px;height:9px;border-radius:50%;
  background:#10b981;flex-shrink:0;
  animation:blink 1s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}

.pred-big {
  font-size:1.8rem;font-weight:800;
  color:#10b981;
  text-shadow:0 0 18px rgba(16,185,129,0.9);
  transition:color 0.2s;
  line-height:1;
}
.pred-big.idle { color:#475569; text-shadow:none; }
.conf-small { font-size:0.75rem; color:rgba(148,163,184,0.85); font-weight:600; margin-top:2px; }

/* ── Bottom bar ── */
.ov-bot {
  position:absolute; bottom:0; left:0; right:0;
  padding:6px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,0.6));
  display:none;
  justify-content:space-between;
  align-items:center;
}
.bot-tag { font-size:0.63rem; color:rgba(148,163,184,0.55); text-transform:uppercase; letter-spacing:0.07em; }

/* ── Confirmed flash border ── */
.flash-ring {
  position:absolute;top:0;left:0;right:0;bottom:0;
  border:3px solid #10b981;border-radius:14px;
  pointer-events:none;opacity:0;
}
.flash-ring.go { animation:flashFade 0.5s ease forwards; }
@keyframes flashFade{0%{opacity:1}100%{opacity:0}}

/* ── Idle / error screen ── */
.idle-screen {
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:260px;gap:12px;
  color:#475569;
}
.idle-screen .big { font-size:2.8rem; }
.idle-screen p { font-size:0.88rem; text-align:center; line-height:1.7; max-width:220px; }
.idle-screen small { font-size:0.72rem; color:#334155; }
</style>
</head>
<body>

<div class="wrapper" id="wrap">
  <div class="idle-screen" id="idle">
    <div class="big">📷</div>
    <p>Starting camera…<br><small>Allow access when browser prompts</small></p>
  </div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="flash-ring" id="flashRing"></div>
  <div class="ov-top" id="ovTop">
    <div class="live-dot"></div>
    <div>
      <div class="pred-big idle" id="predTxt">—</div>
      <div class="conf-small" id="confTxt">Waiting for AI…</div>
    </div>
  </div>
  <div class="ov-bot" id="ovBot">
    <span class="bot-tag">🤟 Live AI Recognition</span>
    <span class="bot-tag" id="fpsTxt">—</span>
  </div>
</div>

<script src="https://unpkg.com/streamlit-component-lib@2.0.0/dist/StreamlitLib.bundle.js"></script>
<script>
const video   = document.getElementById('video');
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const predTxt = document.getElementById('predTxt');
const confTxt = document.getElementById('confTxt');
const ovTop   = document.getElementById('ovTop');
const ovBot   = document.getElementById('ovBot');
const idleDiv = document.getElementById('idle');
const flashRg = document.getElementById('flashRing');
const fpsTxt  = document.getElementById('fpsTxt');

let running = false;
let lastConf = '';
let framesSent = 0;
let fpsT = Date.now();

/* ── Send a frame to Python ── */
function sendFrame() {
  if (!video.videoWidth || document.hidden) return;
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.save(); ctx.scale(-1,1); ctx.drawImage(video,-canvas.width,0); ctx.restore();
  const b64 = canvas.toDataURL('image/jpeg', 0.62).split(',')[1];
  Streamlit.setComponentValue({ frame: b64, ts: Date.now() });
  // fps counter
  framesSent++;
  const now = Date.now();
  if (now - fpsT >= 2000) {
    fpsTxt.textContent = (framesSent/((now-fpsT)/1000)).toFixed(1)+' fps';
    framesSent=0; fpsT=now;
  }
}

/* ── Start webcam ── */
function startCamera() {
  navigator.mediaDevices.getUserMedia({
    video:{ width:{ideal:640}, height:{ideal:480}, facingMode:'user' }
  }).then(stream => {
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      idleDiv.style.display = 'none';
      video.style.minHeight = '';
      ovTop.style.display   = 'flex';
      ovBot.style.display   = 'flex';
      running = true;
      setInterval(sendFrame, 400);   // 2.5 fps → model
      setTimeout(() => {
        Streamlit.setFrameHeight(document.getElementById('wrap').offsetHeight + 6);
      }, 200);
    };
  }).catch(() => {
    idleDiv.innerHTML = '<div class="big">⚠️</div><p>Camera access denied<br><small>Allow camera in browser settings, then reload</small></p>';
    Streamlit.setFrameHeight(200);
  });
}

/* ── Trigger green flash on confirmed letter ── */
function flash() {
  flashRg.classList.remove('go');
  void flashRg.offsetWidth;
  flashRg.classList.add('go');
}

/* ── Receive args from Python on each rerun ── */
function onRender(ev) {
  const a = ev.detail.args || {};

  /* Update prediction display */
  const pred  = a.prediction || '—';
  const conf  = a.confidence  || 0;
  const conf2 = a.confirmed   || '';

  predTxt.textContent = pred;
  if (pred === '—' || pred === 'No hand') {
    predTxt.className = 'pred-big idle';
    confTxt.textContent = 'Waiting for AI…';
  } else {
    predTxt.className = 'pred-big';
    confTxt.textContent = conf > 0 ? 'Confidence: '+conf.toFixed(1)+'%' : '';
  }

  /* Flash on new confirmed letter */
  if (conf2 && conf2 !== lastConf) { flash(); lastConf = conf2; }

  if (!running) startCamera();
}

Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
Streamlit.setFrameHeight(300);
</script>
</body>
</html>
